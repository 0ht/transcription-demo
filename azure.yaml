name: blob-transcription
metadata:
  template: blob-transcription@0.0.1

# Bicep を IaC プロバイダーとして使用（azd のネイティブサポート）
infra:
  provider: bicep
  path: ./infra

services:
  functions:
    project: ./functions
    host: function
    language: python

  ui:
    project: ./ui
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

hooks:
  # 閉域リソースへのデプロイのため一時的に Public Access を開放
  predeploy:
    posix:
      shell: sh
      run: uv run hooks/enable_public_access.py
    windows:
      shell: pwsh
      run: uv run hooks/enable_public_access.py

  # デプロイ完了後に Public Access を閉鎖
  postdeploy:
    posix:
      shell: sh
      run: uv run hooks/disable_public_access.py
    windows:
      shell: pwsh
      run: uv run hooks/disable_public_access.py

  # VNet 統合を解除できた場合のみ、AMPLS を削除して azd down を続行
  predown:
    posix:
      shell: sh
      run: uv run hooks/predown.py
    windows:
      shell: pwsh
      run: uv run hooks/predown.py