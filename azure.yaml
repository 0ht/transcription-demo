name: blob-transcription
metadata:
  template: blob-transcription@0.0.1

# Bicep を IaC プロバイダーとして使用（azd のネイティブサポート）
infra:
  provider: bicep
  path: ./infra

services:
  functions:
    project: ./functions
    host: function
    language: python

  ui:
    project: ./ui
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
    hooks:
      postdeploy:
        posix:
          shell: sh
          run: az containerapp ingress update --name "$SERVICE_UI_RESOURCE_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" --target-port 8000 --output none
        windows:
          shell: pwsh
          run: az containerapp ingress update --name "$env:SERVICE_UI_RESOURCE_NAME" --resource-group "$env:AZURE_RESOURCE_GROUP" --subscription "$env:AZURE_SUBSCRIPTION_ID" --target-port 8000 --output none

hooks:
  # provision 完了後: Azure AI Search の index/indexer/skillset を作成し統合ベクトル化で取り込む
  postprovision:
    posix:
      shell: sh
      run: uv run hooks/setup_search.py
      interactive: true
    windows:
      shell: pwsh
      run: uv run hooks/setup_search.py
      interactive: true

  # 閉域リソースへのデプロイのため一時的に Public Access を開放
  predeploy:
    posix:
      shell: sh
      run: uv run hooks/enable_public_access.py
    windows:
      shell: pwsh
      run: uv run hooks/enable_public_access.py

  # デプロイ完了後に Public Access を閉鎖
  postdeploy:
    posix:
      shell: sh
      run: uv run hooks/disable_public_access.py
    windows:
      shell: pwsh
      run: uv run hooks/disable_public_access.py

  # VNet 統合を解除できた場合のみ、AMPLS を削除して azd down を続行
  predown:
    posix:
      shell: sh
      run: uv run hooks/predown.py
    windows:
      shell: pwsh
      run: uv run hooks/predown.py