<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ffmpeg extractor</title>
  <script>
    // Streamlit に componentReady を最優先で送信（vendor の同期ロード前に通知）
    try {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
        "*"
      );
    } catch (_) {}
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 8px;
      color: #222;
      background: transparent;
      min-height: 360px;
    }
    .row { margin-bottom: 10px; }
    button {
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { background: #999; cursor: not-allowed; }
    progress { width: 100%; height: 14px; }
    .log {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      padding: 6px;
      max-height: 90px;
      overflow: auto;
      white-space: pre-wrap;
      color: #555;
    }
    .err { color: #c00; font-weight: bold; }
    .ok { color: #098; font-weight: bold; }
    .muted { color: #777; font-size: 12px; }
    /* ステップインジケータ */
    .steps {
      display: flex;
      gap: 4px;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .step {
      flex: 1;
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
      color: #888;
      text-align: center;
      border: 1px solid transparent;
    }
    .step.active {
      background: #e8f1ff;
      color: #1f6feb;
      border-color: #1f6feb;
      font-weight: bold;
    }
    .step.done {
      background: #e7f7ee;
      color: #098;
    }
    .step.err {
      background: #fde7e7;
      color: #c00;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-row progress { flex: 1; }
    .pct { font-size: 12px; color: #555; min-width: 38px; text-align: right; }
    .elapsed { font-size: 11px; color: #888; }
  </style>
</head>
<body>
  <div class="row">
    <input type="file" id="file" accept="video/*,.mp4,.mov,.mkv,.webm,.avi" />
  </div>
  <div class="row">
    <button id="run" disabled>🎬 音声を抽出</button>
    <span id="info" class="muted"></span>
  </div>
  <div class="row">
    <div class="steps" id="steps">
      <div class="step" data-step="0">① 初期化</div>
      <div class="step" data-step="1">② 読込</div>
      <div class="step" data-step="2">③ 抽出</div>
      <div class="step" data-step="3">④ 取得</div>
      <div class="step" data-step="4">⑤ 送信</div>
    </div>
    <div class="progress-row">
      <progress id="prog" value="0" max="100"></progress>
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="elapsed" id="elapsed"></div>
  </div>
  <div class="row">
    <div id="status" class="muted">ffmpeg を初期化中…</div>
  </div>
  <div class="row">
    <div id="log" class="log" hidden></div>
  </div>

  <!-- 同一オリジンから ffmpeg.wasm 一式をロード（CDN 不使用、CORS/Worker 制約を完全回避） -->
  <script src="vendor/util.js"></script>
  <script src="vendor/ffmpeg.js"></script>

  <script>
    // ---------------------------------------------------------------
    // Streamlit <-> component bridge (vanilla, no React)
    // ---------------------------------------------------------------
    const RENDER_EVENT = "streamlit:render";

    function sendReady() {
      // head 側で既に送信済みだが、render イベント取りこぼし対策で再送
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
        "*"
      );
    }
    function sendHeight(h) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h },
        "*"
      );
    }
    function sendValue(value) {
      window.parent.postMessage(
        {
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value,
          dataType: "json",
        },
        "*"
      );
    }
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === RENDER_EVENT) {
        // 引数は使わないが、render イベントを受けたら高さを通知
        sendHeight(document.body.scrollHeight);
      }
    });
    sendReady();

    // ---------------------------------------------------------------
    // ffmpeg.wasm loader (CDN, no build)
    // ---------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const fileInput = $("file");
    const runBtn = $("run");
    const status = $("status");
    const info = $("info");
    const prog = $("prog");
    const pct = $("pct");
    const logEl = $("log");
    const elapsedEl = $("elapsed");
    const stepEls = document.querySelectorAll(".step");

    function log(msg) {
      logEl.hidden = false;
      logEl.textContent += msg + "\n";
      logEl.scrollTop = logEl.scrollHeight;
      sendHeight(document.body.scrollHeight);
    }
    function setStatus(text, cls = "muted") {
      status.className = cls;
      status.textContent = text;
      sendHeight(document.body.scrollHeight);
    }
    function setProgress(p) {
      const v = Math.min(100, Math.max(0, p));
      prog.value = v;
      pct.textContent = Math.round(v) + "%";
    }
    function setStep(idx, state) {
      // state: "active" | "done" | "err" | undefined
      stepEls.forEach((el, i) => {
        el.classList.remove("active", "done", "err");
        if (i < idx) el.classList.add("done");
        else if (i === idx && state) el.classList.add(state);
      });
    }
    // 経過時間タイマー
    let _startMs = 0;
    let _timerId = null;
    function startTimer() {
      _startMs = performance.now();
      stopTimer();
      _timerId = setInterval(() => {
        const sec = (performance.now() - _startMs) / 1000;
        elapsedEl.textContent = `⏱ 経過 ${sec.toFixed(1)} 秒`;
      }, 200);
    }
    function stopTimer() {
      if (_timerId) { clearInterval(_timerId); _timerId = null; }
      if (_startMs) {
        const sec = (performance.now() - _startMs) / 1000;
        elapsedEl.textContent = `⏱ 経過 ${sec.toFixed(1)} 秒`;
      }
    }

    let ffmpeg = null;
    let fetchFile = null;
    // 抽出中のステージ（0=初期化, 1=読込, 2=抽出, 3=取得, 4=送信）
    let currentStage = 0;

    async function loadFfmpeg() {
      try {
        setStep(0, "active");
        if (typeof FFmpegWASM === "undefined" || typeof FFmpegUtil === "undefined") {
          throw new Error("vendor/ffmpeg.js または vendor/util.js が読み込めていません");
        }
        const { FFmpeg } = FFmpegWASM;
        fetchFile = FFmpegUtil.fetchFile;
        ffmpeg = new FFmpeg();
        ffmpeg.on("log", ({ message }) => log(message));
        ffmpeg.on("progress", ({ progress }) => {
          // ffmpeg.exec 中（ステージ 2）のみ反映
          if (currentStage === 2) {
            setProgress(progress * 100);
          }
        });
        setStatus("ffmpeg-core を読み込み中…");
        // 同一オリジン (vendor/) の core/wasm を Worker から importScripts で読み込む
        // ※ URL は ffmpeg.js を読み込んだスクリプトのパスから自動解決される
        const here = new URL(".", document.baseURI).href;
        await ffmpeg.load({
          coreURL: here + "vendor/ffmpeg-core.js",
          wasmURL: here + "vendor/ffmpeg-core.wasm",
        });
        setStep(0, "done");
        setStatus("✅ 準備完了。動画ファイルを選択してください。", "ok");
        runBtn.disabled = !fileInput.files.length;
      } catch (e) {
        setStep(0, "err");
        setStatus(
          "❌ ffmpeg の読み込みに失敗しました。詳細はログを参照してください。",
          "err"
        );
        log(String(e));
      }
    }

    fileInput.addEventListener("change", () => {
      runBtn.disabled = !ffmpeg || !fileInput.files.length;
      const f = fileInput.files[0];
      info.textContent = f ? `${f.name} (${(f.size / 1024 / 1024).toFixed(1)} MB)` : "";
    });

    // 進捗付きで File を Uint8Array に読み込む（FileReader）
    function readFileWithProgress(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onprogress = (e) => {
          if (e.lengthComputable) {
            setProgress((e.loaded / e.total) * 100);
          }
        };
        reader.onload = () => resolve(new Uint8Array(reader.result));
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
    }

    // ファイルをチャンク単位で読み込み、進捗を細かく報告して Uint8Array を返す。
    // 大きなファイルでもメインスレッドを長時間ブロックしない。
    async function readFileChunked(file, chunkSize = 8 * 1024 * 1024) {
      const total = file.size;
      const out = new Uint8Array(total);
      let offset = 0;
      while (offset < total) {
        const end = Math.min(offset + chunkSize, total);
        const slice = file.slice(offset, end);
        const buf = new Uint8Array(await slice.arrayBuffer());
        out.set(buf, offset);
        offset = end;
        setProgress((offset / total) * 100);
        // メインスレッドを少し解放して UI を更新
        await new Promise((r) => setTimeout(r, 0));
      }
      return out;
    }

    runBtn.addEventListener("click", async () => {
      const f = fileInput.files[0];
      if (!f || !ffmpeg) return;
      runBtn.disabled = true;
      fileInput.disabled = true;
      logEl.hidden = false;
      logEl.textContent = "";
      setProgress(0);
      startTimer();
      log(`[click] file=${f.name} size=${f.size} bytes`);

      const inName = "input" + (f.name.match(/\.[^.]+$/)?.[0] || ".bin");
      // 出力は MP3 固定: ffmpeg.wasm の native AAC encoder は ipod(m4a) コンテナで
      // moov atom が末尾配置となり Azure Speech が "InvalidData" を返す。
      // libmp3lame は枯れており、Speech も MP3 を公式サポートする。
      const outName = "output.mp3";

      try {
        // ステージ 1: ファイル読込（チャンク + 進捗）
        currentStage = 1;
        setStep(1, "active");
        setStatus(`📥 ファイルをブラウザに読み込み中… (${(f.size / 1024 / 1024).toFixed(1)} MB)`);
        log("[step2] reading file via slice().arrayBuffer() chunks…");
        const inputBytes = await readFileChunked(f);
        log(`[step2] read complete: ${inputBytes.length} bytes. writing to ffmpeg FS…`);
        setStatus("📥 ffmpeg メモリへ書き込み中…");
        setProgress(0);
        // wasm FS への書き込みは同期処理（中断不可）。ファイルが巨大だと数秒かかる
        await ffmpeg.writeFile(inName, inputBytes);
        log("[step2] writeFile done");
        setProgress(100);
        setStep(1, "done");

        // ステージ 2: ffmpeg 抽出（MP3 / libmp3lame に再エンコード）
        // 元動画の音声コーデックを問わず Azure Speech 互換の MP3 を生成する。
        // - native AAC + ipod(m4a) は moov 末尾配置で Speech が拒否するため使用しない。
        // - libmp3lame は ffmpeg.wasm core にビルド済み(`--enable-libmp3lame`)。
        // - モノラル 16kHz は Speech の推奨フォーマットで、文字起こし精度に十分。
        currentStage = 2;
        setStep(2, "active");
        setProgress(0);
        setStatus("🎵 音声を MP3 (libmp3lame) で再エンコード中…");
        await ffmpeg.exec([
          "-i", inName,
          "-vn",
          "-c:a", "libmp3lame",
          "-b:a", "64k",
          "-ar", "16000",
          "-ac", "1",
          outName,
        ]);
        const data = await ffmpeg.readFile(outName);
        if (!data || data.length === 0) {
          throw new Error("ffmpeg returned empty output");
        }
        setStep(2, "done");

        // ステージ 3: 結果取得 + クリーンアップ
        currentStage = 3;
        setStep(3, "active");
        setProgress(50);
        setStatus("📤 抽出済み音声を取り出し中…");
        try { await ffmpeg.deleteFile(inName); } catch (_) {}
        try { await ffmpeg.deleteFile(outName); } catch (_) {}
        setProgress(100);
        setStep(3, "done");

        // ステージ 4: Python へ base64 で送信
        currentStage = 4;
        setStep(4, "active");
        setProgress(0);
        setStatus("📡 Python (Streamlit) に送信中…");
        const bytes = new Uint8Array(data.buffer || data);
        const b64 = await bytesToBase64(bytes);
        setProgress(80);

        const baseName = f.name.replace(/\.[^.]+$/, "") + ".mp3";
        sendValue({ name: baseName, data_b64: b64, size: bytes.length });
        setProgress(100);
        setStep(4, "done");
        // すべて完了
        setStep(5, undefined); // 全部 done に
        setStatus(
          `✅ 抽出完了: ${baseName} (${(bytes.length / 1024 / 1024).toFixed(1)} MB) — Python 側のアップロードボタンに表示されます。`,
          "ok"
        );
      } catch (e) {
        setStep(currentStage, "err");
        setStatus("❌ 抽出に失敗しました。詳細はログを参照してください。", "err");
        log(String(e));
      } finally {
        stopTimer();
        runBtn.disabled = false;
        fileInput.disabled = false;
        sendHeight(document.body.scrollHeight);
      }
    });

    // 巨大バイナリでもブラウザを固まらせない base64 化
    async function bytesToBase64(bytes) {
      // FileReader 経由（メインスレッドだが高速）
      return new Promise((resolve, reject) => {
        const blob = new Blob([bytes]);
        const reader = new FileReader();
        reader.onload = () => {
          const url = reader.result; // "data:...;base64,XXXX"
          const idx = url.indexOf(",");
          resolve(url.substring(idx + 1));
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    loadFfmpeg();
  </script>
</body>
</html>
